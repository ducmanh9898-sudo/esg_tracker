rules:
  - {rule_id: GW01, name: VAGUE_CLAIM, description: "Claim dùng ngôn ngữ quảng bá nhưng thiếu đối tượng đo hoặc số liệu.", enabled: true, severity: 2, required_fields: [claim_text], conditions: [vague_terms_present, no_value], exclusions: [policy_statement], explanation_template: "Claim dùng diễn đạt mơ hồ nhưng chưa nêu chỉ số kiểm chứng: {claim_text}"}
  - {rule_id: GW02, name: EVIDENCE_GAP, description: "Không tìm thấy bằng chứng phù hợp cho claim cần kiểm chứng.", enabled: true, severity: 3, required_fields: [claim_id], conditions: [relationship_missing], exclusions: [pure_policy], explanation_template: "Chưa tìm thấy bằng chứng đủ điều kiện cho claim tại {document} trang {page}."}
  - {rule_id: GW03, name: WEAK_TARGET, description: "Mục tiêu thiếu baseline, target year, scope hoặc đơn vị.", enabled: true, severity: 3, required_fields: [claim_type], conditions: [target_incomplete], exclusions: [policy_statement], explanation_template: "Mục tiêu thiếu một hoặc nhiều thuộc tính: năm cơ sở, thời hạn, phạm vi hoặc đơn vị."}
  - {rule_id: GW04, name: CROSS_DOC_CONTRADICTION, description: "Hai tài liệu có giá trị trái ngược sau khi xác nhận khả năng so sánh.", enabled: true, severity: 5, required_fields: [metric_code, report_year], conditions: [comparable, value_difference_exceeds_tolerance], exclusions: [capex_vs_opex, separate_vs_consolidated, unit_not_convertible, scope_mismatch, boundary_mismatch, absolute_vs_intensity], explanation_template: "Claim và bằng chứng khác nhau vượt ngưỡng {tolerance} sau khi xác nhận cùng metric, kỳ, đơn vị, scope và boundary."}
  - {rule_id: GW05, name: TEMPORAL_CONTRADICTION, description: "Claim nói cải thiện nhưng chuỗi số liệu có chiều xấu đi.", enabled: true, severity: 4, required_fields: [direction, metric_code], conditions: [claim_improves, observed_worsens, comparable], exclusions: [baseline_missing, boundary_mismatch], explanation_template: "Chiều hướng claim không phù hợp với chuỗi số liệu so sánh được."}
  - {rule_id: GW06, name: SELECTIVE_DISCLOSURE, description: "Metric trọng yếu biến mất sau ít nhất hai năm công bố.", enabled: true, severity: 3, required_fields: [metric_code], conditions: [two_prior_years_present, current_year_missing], exclusions: [explained_omission], explanation_template: "Chỉ số từng được công bố liên tiếp nhưng thiếu trong năm hiện tại; cần rà soát lý do."}
  - {rule_id: GW07, name: BASELINE_SHIFT, description: "Năm cơ sở thay đổi mà thiếu giải thích hoặc restatement.", enabled: true, severity: 4, required_fields: [baseline_year], conditions: [baseline_changed, no_restatement], exclusions: [transparent_restatement], explanation_template: "Năm cơ sở thay đổi nhưng chưa thấy giải thích hoặc bảng điều chỉnh hồi tố."}
  - {rule_id: GW08, name: SCOPE_SHIFT, description: "Phạm vi đo hẹp hơn nhưng claim trình bày như cùng phạm vi.", enabled: true, severity: 5, required_fields: [scope, boundary], conditions: [scope_or_boundary_changed, comparative_claim], exclusions: [boundary_reconciliation], explanation_template: "Scope hoặc boundary thay đổi; kết quả được giữ ở NOT_COMPARABLE, không kết luận mâu thuẫn."}
  - {rule_id: GW09, name: UNIT_MISMATCH, description: "Hai giá trị khác đơn vị và chưa quy đổi được.", enabled: true, severity: 2, required_fields: [raw_unit], conditions: [unit_mismatch, unit_not_convertible], exclusions: [valid_conversion], explanation_template: "Đơn vị không tương thích hoặc thiếu hệ số quy đổi; kết quả không được xem là mâu thuẫn."}
  - {rule_id: GW10, name: ABS_INTENSITY_MIX, description: "Dùng cường độ giảm để diễn đạt như tổng tuyệt đối giảm.", enabled: true, severity: 4, required_fields: [value_kind], conditions: [absolute_intensity_mix], exclusions: [claim_explicitly_intensity], explanation_template: "Giá trị tuyệt đối và cường độ không thể đối chiếu trực tiếp khi thiếu mẫu số."}
  - {rule_id: GW11, name: MISSING_METHODOLOGY, description: "Chỉ số trọng yếu thiếu phương pháp hoặc phạm vi tính.", enabled: true, severity: 2, required_fields: [metric_code], conditions: [methodology_missing], exclusions: [standard_method_cited], explanation_template: "Chỉ số trọng yếu chưa nêu phương pháp hoặc ranh giới tính toán."}
  - {rule_id: GW12, name: UNBALANCED_CLAIM, description: "Claim chỉ nhấn mạnh cải thiện nhỏ khi chỉ số chính xấu đi.", enabled: true, severity: 3, required_fields: [topic_id], conditions: [positive_claim, related_metric_worsens], exclusions: [different_topic], explanation_template: "Claim tích cực cần được đọc cùng chỉ số liên quan có chiều hướng xấu đi."}
  - {rule_id: GW13, name: FUTURE_ONLY, description: "Cam kết tương lai lặp lại nhưng thiếu tiến độ.", enabled: true, severity: 3, required_fields: [claim_type], conditions: [target_repeated, progress_missing], exclusions: [new_target], explanation_template: "Cam kết tương lai chưa đi kèm số liệu tiến độ trong kỳ."}
  - {rule_id: GW14, name: RESTATEMENT_GAP, description: "Số liệu năm trước bị sửa nhưng không giải thích.", enabled: true, severity: 4, required_fields: [metric_code], conditions: [prior_value_changed, no_restatement], exclusions: [rounding_within_tolerance], explanation_template: "Giá trị quá khứ thay đổi vượt ngưỡng nhưng chưa có giải thích điều chỉnh."}
  - {rule_id: GW15, name: GRI_OMISSION, description: "Chủ đề GRI 11 có khả năng trọng yếu nhưng thiếu công bố và giải trình.", enabled: true, severity: 3, required_fields: [topic_id], conditions: [gri11_material_topic, disclosure_missing], exclusions: [documented_not_material], explanation_template: "Chưa thấy công bố hoặc giải trình cho chủ đề GRI 11 có khả năng trọng yếu."}

