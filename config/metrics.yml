metrics:
  GHG_SCOPE_1:
    name: "Phát thải khí nhà kính Phạm vi 1"
    name_vi: "Phát thải trực tiếp Phạm vi 1"
    name_en: "Scope 1 greenhouse gas emissions"
    variants: ["scope 1", "phạm vi 1", "phát thải trực tiếp"]
    standard_unit: "tCO2e"
    gri_reference: "GRI 305-1; GRI 11.1"
    direction: "LOWER_IS_BETTER"
    comparable_when: ["same_period", "same_scope", "same_boundary", "convertible_unit", "absolute_value"]
    tolerance: 0.01
  GHG_SCOPE_2:
    name: "Phát thải khí nhà kính Phạm vi 2"
    name_vi: "Phát thải gián tiếp Phạm vi 2"
